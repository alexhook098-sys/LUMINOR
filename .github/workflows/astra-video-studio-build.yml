name: ASTRA VIDEO STUDIO Android Build

on:
  pull_request:
    paths:
      - "ASTRA_VIDEO_STUDIO/**"
      - ".github/workflows/astra-video-studio-build.yml"
  push:
    branches:
      - "feature/astra-video-studio"
    paths:
      - "ASTRA_VIDEO_STUDIO/**"
      - ".github/workflows/astra-video-studio-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: ASTRA_VIDEO_STUDIO
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: astra-video-studio-debug-apk
          path: ASTRA_VIDEO_STUDIO/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
